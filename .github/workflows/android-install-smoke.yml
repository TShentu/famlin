name: Android hosted APK installation smoke test
on:
  workflow_dispatch:
  push:
    branches: [codex/android-selfhost]
    paths: ['.github/workflows/android-install-smoke.yml']
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the public release and verify its checksum
        run: |
          mkdir -p smoke
          curl --fail --location --retry 3 https://c89009ed.hzfystt.olares.cn/latest.json -o smoke/latest.json
          python3 - <<'PY'
          import json, subprocess, hashlib, pathlib
          m=json.loads(pathlib.Path('smoke/latest.json').read_text())
          assert m['apkUrl'].startswith('https://c89009ed.hzfystt.olares.cn/')
          subprocess.run(['curl','--fail','--location','--retry','3',m['apkUrl'],'-o','smoke/app.apk'],check=True)
          apk=pathlib.Path('smoke/app.apk')
          assert apk.stat().st_size == m['size']
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == m['sha256']
          PY
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash deploy/downloads/scripts/smoke-install.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-install-smoke
          path: |
            smoke/*.png
            smoke/*.xml
            smoke/*.txt
            smoke/latest.json
          retention-days: 14
