name: Android self-hosted APK

on:
  workflow_dispatch:
  push:
    branches: [main, codex/devops-zh]
    paths:
      - '.github/workflows/android-selfhost.yml'
      - 'mobile/**'
      - 'packages/api-client/**'
      - 'backend/**'
      - 'web/**'
      - 'deploy/devops/**'
      - 'deploy/olares/scripts/**'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: android-selfhost-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: https://762e7148.hzfystt.olares.cn
      FAMLIN_SELF_HOSTED: '1'
      FAMLIN_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - run: python3 -m unittest discover -s deploy/devops/scripts -p 'test_*.py'
      - run: node web/scripts/check-zh.mjs
      - run: npm run lint && npx tsc --noEmit && npm test -- --runInBand
        working-directory: mobile
      - run: npx expo install --check
        working-directory: mobile
      - run: npx expo prebuild --platform android --no-install
        working-directory: mobile
      - name: Keep signing on the local publishing machine
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('mobile/android/app/build.gradle')
          text = p.read_text()
          marker = 'signingConfig signingConfigs.debug'
          if marker not in text:
              raise SystemExit('Unexpected Expo Gradle signing structure')
          p.write_text(text.replace(marker, 'signingConfig null'))
          PYCODE
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Verify and collect APK
        run: |
          mkdir -p apk-artifact
          cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk apk-artifact/famlin-family-unsigned.apk
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging apk-artifact/famlin-family-unsigned.apk > apk-artifact/package-info.txt
          sha256sum apk-artifact/famlin-family-unsigned.apk > apk-artifact/SHA256SUMS
          git rev-parse HEAD > apk-artifact/source-commit.txt
      - name: Package matching server source
        run: python3 deploy/devops/scripts/pack-source.py --output apk-artifact/server-source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: famlin-family-apk-${{ github.run_number }}
          path: apk-artifact/
          retention-days: 30

  android-smoke:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: famlin-family-apk-${{ github.run_number }}
          path: unsigned
      - name: Sign a disposable emulator copy
        run: |
          mkdir -p smoke
          keytool -genkeypair -keystore /tmp/smoke.jks -storepass android -keypass android -alias smoke -dname 'CN=CI Smoke' -keyalg RSA -validity 2
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" sign --ks /tmp/smoke.jks --ks-pass pass:android --out smoke/app.apk unsigned/famlin-family-unsigned.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash deploy/downloads/scripts/smoke-install.sh && python3 deploy/devops/scripts/smoke-language.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-zh-smoke-${{ github.run_number }}
          path: |
            smoke/*.png
            smoke/*.xml
            smoke/*.txt

  stage:
    needs: [apk, android-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: famlin-family-apk-${{ github.run_number }}
          path: bundle
      - name: Publish verified unsigned candidate for the deployment worker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          # A superseded SHA that changes workflows cannot create a release with
          # GITHUB_TOKEN. Publish only the current branch head, never grant a PAT.
          HEAD_SHA=$(gh api "repos/$REPO/commits/$SOURCE_BRANCH" --jq .sha)
          if [ "$HEAD_SHA" != "$SOURCE_SHA" ]; then
            echo 'Superseded candidate; a newer branch build will publish.'
            exit 0
          fi
          cd bundle
          sha256sum famlin-family-unsigned.apk server-source.tgz package-info.txt source-commit.txt > checksums.txt
          gh release create "dev-build-${RUN_NUMBER}" --repo "$REPO" --target "$SOURCE_SHA" --prerelease --title "Dev build ${RUN_NUMBER}" --notes 'Unsigned build candidate. Install the signed APK from the Olares download page.' ./*
