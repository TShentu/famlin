olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: famlindevops
  appid: famlindevops
  title: Famlin DevOps
  description: Verify and publish tested Famlin development releases
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.2.0
  categories: [Utilities]
entrances:
- name: famlindevops
  host: famlindevops
  port: 8080
  title: Famlin DevOps
  authLevel: private
  openMethod: window
spec:
  versionName: '1.0.0'
  runAsUser: true
  supportArch: [amd64]
  requiredCpu: 50m
  limitedCpu: '1'
  requiredMemory: 128Mi
  limitedMemory: 1Gi
  requiredDisk: 2Gi
permission:
  appData: true
  userData:
  - Home/Documents/FamlinDev
  - Home/Documents/FamlinDownloads
options:
  apiTimeout: 600
  policies:
  - uriRegex: '^/candidates$'
    level: public
    oneTime: false
    validDuration: 0s
    entranceName: famlindevops
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
workloadReplicas:
  famlindevops: 1
