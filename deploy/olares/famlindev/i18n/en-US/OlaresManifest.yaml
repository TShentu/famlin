olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: v3
metadata:
  name: famlindev
  appid: famlindev
  title: Famlin Dev
  description: Self-hosted family photos, videos, and updates
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  version: 0.1.0
  categories:
  - Lifestyle
  - homelab
entrances:
- name: famlindev
  host: famlindev
  port: 3000
  title: Famlin Dev
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  authLevel: private
  openMethod: window
  windowPushState: true
spec:
  versionName: '0.7.0'
  runAsUser: true
  developer: Tim Van Onckelen / TShentu
  submitter: TShentu
  website: https://famlindev.app
  sourceCode: https://github.com/TShentu/famlin
  doc: https://famlindev.app/docs
  fullDescription: |
    Private source development environment for the Famlin fork. Vite hot reload and backend file watching; independent database and uploads. Source lives in Home/Documents/FamlinDev/source.
  locale:
  - en-US
  license:
  - text: MIT
    url: https://github.com/TShentu/famlin/blob/v0.7.0/LICENSE
  supportArch:
  - amd64
  requiredCpu: 100m
  limitedCpu: '2'
  requiredMemory: 256Mi
  limitedMemory: 4Gi
  requiredDisk: 2Gi
permission:
  userData:
  - Home/Documents/FamlinDev
middleware:
  postgres:
    username: famlindev
    databases:
    - name: famlindev
options:
  apiTimeout: 600
  mobileSupported: true
  allowedOutboundPorts:
  - 465
  - 587
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.6-0'
  - name: postgres
    type: middleware
    version: '>=16.0.0-0'
    mandatory: true
workloadReplicas:
  famlindev: 1
